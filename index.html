<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-width: 320px;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background:
    radial-gradient(ellipse at 0 0, rgba(255,211,192,.60), transparent 48%),
    radial-gradient(ellipse at 0 100%, rgba(181,249,223,.54), transparent 49%),
    radial-gradient(ellipse at 100% 0, rgba(233,218,255,.48), transparent 49%),
    radial-gradient(ellipse at 100% 100%, rgba(190,224,255,.53), transparent 50%),
    #f8f8f7;
  color: #201c35;
  font-family: "Nunito Sans", Arial, sans-serif;
}

main {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.join-card {
  width: 344px;
  height: 414px;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 28px 33px;
  border: 1px solid rgba(255,255,255,.94);
  border-radius: 36px;
  background: rgba(255,255,255,.88);
  box-shadow:
    0 28px 65px rgba(50,45,76,.16),
    0 5px 18px rgba(105,91,145,.04);
  text-align: center;
  animation: cardFloat 5s ease-in-out infinite;
  transform-origin: center;
}

.avatar-wrap {
  position: relative;
  width: 184px;
  height: 184px;
  flex: 0 0 184px;
  display: grid;
  place-items: center;
  margin: 0 auto;
}

.avatar-ring {
  position: absolute;
  inset: 0;
  border: 1.5px dashed #c9b9ff;
  border-radius: 50%;
  animation: ringRotate 18s linear infinite;
  transform-origin: center;
}

.avatar-halo {
  position: absolute;
  inset: 9px;
  border: 5px solid #f4efff;
  border-radius: 50%;
  box-shadow: 0 5px 13px rgba(101,81,199,.16);
  animation: haloPulse 3s ease-in-out infinite;
}

.avatar-art {
  position: absolute;
  width: 146px;
  height: 146px;
  object-fit: cover;
  object-position: center;
  border: 5px solid white;
  border-radius: 50%;
  box-shadow: 0 3px 12px rgba(37,31,72,.22);
}

/* The dot travels around the outside ring */
.avatar-dot-orbit {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  animation: dotOrbit 4s linear infinite;
  transform-origin: center;
  will-change: transform;
}

.avatar-dot {
  position: absolute;
  top: 2px;
  left: calc(50% - 4px);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #8b63ff;
  box-shadow:
    0 0 8px #a18bff,
    0 0 16px rgba(161,139,255,.55);
  animation: dotPulse 1.5s ease-in-out infinite;
}

.avatar-check {
  position: absolute;
  right: 22px;
  bottom: 21px;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 3px solid white;
  border-radius: 50%;
  background: linear-gradient(135deg,#6956e6,#9860ff);
  color: white;
  font-size: 19px;
  font-weight: 900;
  box-shadow: 0 4px 9px #6544a755;
  animation: checkFloat 2.5s ease-in-out infinite;
}

.brand-title {
  width: 100%;
  margin: 8px 0 0;
  white-space: nowrap;
  font-family: "Playfair Display", Georgia, serif;
  font-size: 23px;
  font-weight: 800;
  line-height: 1.28;
  letter-spacing: -.5px;
  background: linear-gradient(100deg,#6a59e2,#4d439f);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.title-underline {
  width: 60px;
  height: 4px;
  flex: 0 0 4px;
  margin-top: 8px;
  border-radius: 99px;
  background: linear-gradient(90deg,#b7a4ff,#a5e8d9);
}

.join-button {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  height: 81px;
  flex: 0 0 81px;
  margin-top: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 24px;
  background: linear-gradient(108deg,#6555e5 0%,#8064ee 55%,#8b4df5 100%);
  box-shadow:
    0 14px 28px rgba(100,76,222,.40),
    0 4px 10px rgba(115,79,228,.18);
  color: #fff;
  font-family: "Nunito Sans", Arial, sans-serif;
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
}

.join-button::before {
  content: "";
  position: absolute;
  z-index: 0;
  top: -30%;
  bottom: -30%;
  left: -45%;
  width: 35%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.4),
    transparent
  );
  transform: skewX(-22deg);
  animation: buttonShine 3.2s ease-in-out infinite;
  pointer-events: none;
}

.join-button svg,
.join-button span {
  position: relative;
  z-index: 1;
}

.join-button:hover {
  filter: brightness(1.06);
}

.join-button:disabled {
  opacity: .75;
  cursor: wait;
}

.telegram-icon {
  width: 23px;
  height: 23px;
  flex: 0 0 23px;
  fill: currentColor;
}

.status {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

/* Animations */
@keyframes cardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@keyframes ringRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes dotOrbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes haloPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.035); }
}

@keyframes dotPulse {
  0%, 100% {
    transform: scale(1);
    opacity: .78;
  }
  50% {
    transform: scale(1.45);
    opacity: 1;
  }
}

@keyframes checkFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@keyframes buttonShine {
  0%, 15% { left: -45%; }
  65%, 100% { left: 125%; }
}

@media (prefers-reduced-motion: reduce) {
  .join-card,
  .avatar-ring,
  .avatar-halo,
  .avatar-dot-orbit,
  .avatar-dot,
  .avatar-check,
  .join-button::before {
    animation: none !important;
  }
}

@media (max-width: 380px) {
  .join-card {
    padding-right: 22px;
    padding-left: 22px;
  }

  .brand-title {
    font-size: clamp(21px, 6.4vw, 23px);
  }
}
</style>

<script>
const params = new URLSearchParams(window.location.search);

function getSession() {
  const key = "twaj_session_tradewithbadshah";
  let id = sessionStorage.getItem(key);

  if (!id) {
    id = window.crypto && typeof window.crypto.randomUUID === "function"
      ? window.crypto.randomUUID().replace(/-/g, "")
      : Date.now().toString(36) + Math.random().toString(36).slice(2);

    sessionStorage.setItem(key, id);
  }

  return id;
}

function getCookie(name) {
  const prefix = name + "=";
  const row = document.cookie
    .split(";")
    .map(item => item.trim())
    .find(item => item.startsWith(prefix));

  if (!row) return "";

  try {
    return decodeURIComponent(row.substring(prefix.length));
  } catch {
    return row.substring(prefix.length);
  }
}

function getMetaFbc() {
  const fbc = getCookie("_fbc");
  if (fbc) return fbc;

  const fbclid = params.get("fbclid");
  return fbclid ? "fb.1." + Date.now() + "." + fbclid : "";
}

const campaignData = {
  session_id: getSession(),
  campaign: params.get("utm_campaign") || params.get("campaign") || "",
  source: params.get("utm_source") || "",
  medium: params.get("utm_medium") || "",
  content: params.get("utm_content") || ""
};

// NEW: Save PageView in the tracker database for dashboard reporting.
fetch("/api/event", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    ...campaignData,
    event_type: "PageView"
  }),
  keepalive: true
}).catch(error => {
  console.error("Page view tracking failed:", error);
});

document.getElementById("joinBtn").addEventListener("click", async () => {
  const btn = document.getElementById("joinBtn");
  const status = document.getElementById("status");

  btn.disabled = true;
  btn.querySelector("span").textContent = "Preparing link…";
  status.textContent = "";

  try {
    const response = await fetch("/api/public/pages/tradewithbadshah/invite", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ...campaignData,
        fbp: getCookie("_fbp"),
        fbc: getMetaFbc()
      })
    });

    const data = await response.json();

    if (!response.ok || !data.url) {
      throw new Error(data.error || "Could not create join link.");
    }

    if (typeof window.fbq === "function") {
      fbq("trackCustom", "TelegramClick");
    }

    // This opens the unique invite link.
    // The server records the click and Telegram webhook records the request.
    window.location.href = data.url;

  } catch (error) {
    console.error("Telegram invite error:", error);
    status.textContent = "Could not create a join link. Please try again.";
    btn.disabled = false;
    btn.querySelector("span").textContent = "Try Again";
  }
});
</script>
