<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef7ff" />
  <title>Join Telegram Channel</title>
  <style>
    :root {
      --telegram: #0088f5;
      --telegram-dark: #0875dc;
      --sky: #dceeff;
      --ink: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(160, 214, 255, .55), transparent 36%),
        linear-gradient(135deg, #e5f3ff 0%, #ffffff 48%, #e8f5ff 100%);
      color: #14243a;
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 22px;
      overflow: hidden;
    }

    /* Soft background waves */
    .wave {
      position: absolute;
      z-index: -2;
      width: 48vw;
      height: 38vw;
      min-width: 340px;
      min-height: 280px;
      border-radius: 48% 52% 60% 40%;
      background: linear-gradient(140deg, rgba(83, 174, 255, .38), rgba(190, 225, 255, .06));
      filter: blur(1px);
      pointer-events: none;
    }
    .wave--top { top: -22%; left: -14%; transform: rotate(-22deg); }
    .wave--bottom { right: -17%; bottom: -27%; transform: rotate(155deg); }

    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(36px, 5.5vw, 64px);
      width: min(100%, 900px);
      animation: content-in .85s cubic-bezier(.2,.75,.25,1) both;
    }

    .portrait-wrap {
      position: relative;
      width: clamp(190px, 31vw, 390px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      animation: float 5.5s ease-in-out infinite;
    }

    .portrait-wrap::before,
    .portrait-wrap::after {
      content: "";
      position: absolute;
      inset: -11%;
      border: 1px solid rgba(0, 136, 245, .12);
      border-radius: 50%;
      animation: halo 4.2s ease-out infinite;
    }
    .portrait-wrap::after { animation-delay: 2.1s; }

    .portrait {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #e4e9f1, #cbd6e5);
      border: 9px solid rgba(255,255,255,.98);
      box-shadow:
        0 22px 55px rgba(0, 136, 245, .22),
        0 0 0 8px rgba(255,255,255,.25);
      position: relative;
    }

    /* Replace the placeholder with your own image:
       <img class="profile-image" src="your-photo.jpg" alt="Profile" /> */
    .placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #8997a9;
    }
    .placeholder svg { width: 76%; height: 76%; }

    .profile-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .accent-rays {
      position: absolute;
      right: -11%;
      top: -9%;
      display: flex;
      gap: 10px;
      transform: rotate(15deg);
    }
    .accent-rays span {
      width: 12px;
      height: 43px;
      border-radius: 20px;
      background: #078cff;
      animation: ray-pop 1.8s ease-in-out infinite alternate;
    }
    .accent-rays span:nth-child(2) { transform: rotate(25deg) translateY(9px); animation-delay: .2s; }
    .accent-rays span:nth-child(3) { transform: rotate(45deg) translateY(19px); animation-delay: .4s; }

    .telegram-plane {
      position: absolute;
      width: clamp(38px, 6vw, 76px);
      color: #2ba7f7;
      opacity: .72;
      filter: drop-shadow(0 8px 14px rgba(0,136,245,.12));
      animation: plane-drift 6s ease-in-out infinite;
      pointer-events: none;
    }
    .plane-left { left: -27vw; top: 52%; width: clamp(40px, 6.5vw, 82px); }
    .plane-right { right: -25vw; top: -8%; width: clamp(58px, 9vw, 110px); animation-delay: -2s; }
    .plane-far { right: -33vw; bottom: 8%; width: clamp(30px, 4.5vw, 58px); opacity: .42; animation-delay: -3.5s; }

    .flight-path {
      position: absolute;
      z-index: -1;
      width: 150%;
      height: 75%;
      inset: 12% -25% auto;
      pointer-events: none;
      overflow: visible;
    }
    .flight-path path {
      fill: none;
      stroke: #8ccaff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 3 8;
      animation: dash 18s linear infinite;
      opacity: .8;
    }

    .join-button {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.2vw, 28px);
      width: min(100%, 710px);
      min-height: clamp(76px, 10vw, 120px);
      padding: 18px clamp(22px, 4vw, 48px);
      border: 2px solid rgba(255,255,255,.72);
      border-radius: 999px;
      background: linear-gradient(110deg, #12a4ff 0%, #0088f5 52%, #0876e5 100%);
      color: var(--ink);
      text-decoration: none;
      font-size: clamp(18px, 3.1vw, 36px);
      font-weight: 750;
      letter-spacing: -.035em;
      white-space: nowrap;
      box-shadow:
        0 18px 38px rgba(0, 136, 245, .3),
        0 0 0 1px rgba(255,255,255,.35) inset;
      transition: transform .28s ease, box-shadow .28s ease, filter .28s ease;
      animation: button-glow 3.5s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }
    .join-button::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -5px;
      border-radius: inherit;
      background: linear-gradient(110deg, rgba(30,174,255,.38), rgba(0,136,245,.08));
      filter: blur(13px);
      opacity: .8;
      transition: opacity .3s ease;
    }
    .join-button:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 24px 48px rgba(0, 136, 245, .36);
      filter: saturate(1.08);
    }
    .join-button:hover::before { opacity: 1; }
    .join-button:active { transform: translateY(-1px) scale(.99); }
    .join-button:focus-visible { outline: 3px solid #164b9b; outline-offset: 6px; }

    .button-icon { width: clamp(34px, 5.2vw, 60px); height: auto; flex: 0 0 auto; }
    .button-divider { height: clamp(34px, 4.5vw, 56px); width: 2px; background: rgba(255,255,255,.55); }
    .button-arrow {
      width: clamp(22px, 3.2vw, 38px);
      height: auto;
      flex: 0 0 auto;
      transition: transform .28s ease;
    }
    .join-button:hover .button-arrow { transform: translateX(6px); }

    @keyframes content-in {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes halo {
      0% { transform: scale(.92); opacity: .6; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    @keyframes ray-pop {
      from { opacity: .65; }
      to { opacity: 1; }
    }
    @keyframes plane-drift {
      0%, 100% { transform: translate(0,0) rotate(-7deg); }
      50% { transform: translate(10px,-14px) rotate(3deg); }
    }
    @keyframes dash { to { stroke-dashoffset: -180; } }
    @keyframes button-glow {
      0%, 100% { box-shadow: 0 18px 38px rgba(0,136,245,.28), 0 0 0 1px rgba(255,255,255,.35) inset; }
      50% { box-shadow: 0 20px 45px rgba(0,136,245,.38), 0 0 0 1px rgba(255,255,255,.45) inset; }
    }

    @media (max-width: 600px) {
      .scene { padding: 28px 20px; }
      .content { gap: 42px; }
      .portrait-wrap { width: clamp(175px, 56vw, 265px); }
      .portrait { border-width: 6px; }
      .join-button {
        width: 100%;
        min-height: 72px;
        gap: 13px;
        padding: 16px 18px;
        font-size: clamp(16px, 4.2vw, 22px);
      }
      .button-divider { height: 31px; }
      .button-icon { width: 30px; }
      .button-arrow { width: 22px; }
      .plane-left { left: -10vw; top: 43%; }
      .plane-right { right: -8vw; top: -16%; }
      .plane-far { right: -13vw; bottom: -3%; }
      .accent-rays { right: -8%; top: -10%; gap: 7px; }
      .accent-rays span { width: 8px; height: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
